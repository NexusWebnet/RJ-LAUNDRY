<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login - RJ Laundry</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/staff.css">
</head>
<body class="login-body">

    <div class="login-container">
        <!-- Left Side / Brand -->
        <div class="login-left">
            <div class="brand">
                <div class="logo">
                    <i class="fas fa-tshirt"></i>
                    <div>
                        <h1>RJ</h1>
                        <h2>LAUNDRY</h2>
                    </div>
                </div>
                <p class="tagline">Clean Clothes, Happy Life</p>
            </div>
        </div>

        <!-- Right Side / Form -->
        <div class="login-right">
            <div class="login-card">
                <h2>Staff Login</h2>
                <p class="subtitle">Sign in to access your account</p>

                <form id="staffLoginForm">
                    <div class="form-group">
                        <label>Staff ID or Email</label>
                        <div class="input-with-icon">
                            <i class="fas fa-user"></i>
                            <input type="text" id="staffId" placeholder="Enter Staff ID or Email" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <div class="input-with-icon">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="password" placeholder="Enter your password" required>
                            <i class="fas fa-eye toggle-password"></i>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="remember">
                            <input type="checkbox" id="remember"> Remember me
                        </label>
                        <a href="#" class="forgot">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn-login">Login</button>
                </form>

                <p class="footer-text">© 2025 RJ Laundry. All rights reserved.</p>
            </div>
        </div>
    </div>

    <script src="../assets/js/staff-login.js"></script>
</body>
</html>
